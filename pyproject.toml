[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-quantum-emulated-diffusion-repl"
version = "0.1.0"
description = "A continuous diffusion feedback engine around a persistent Jupyter REPL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "jupyter-client>=8.6,<9",
    "ipykernel>=6.29,<8",
]

[tool.setuptools.packages.find]
include = ["quantum_diffusion*"]
